[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rl-pfp-overlay"
version = "0.1.0"
description = "RL PFP Overlay — profile pictures over Rocket League's scoreboard/goal replay"
requires-python = ">=3.10"
dependencies = [
    "aiohttp",
    "requests",
    "Pillow",
    "PyGObject; sys_platform == 'linux'",
    "evdev; sys_platform == 'linux'",
    "pywin32; sys_platform == 'win32'",
    "hidapi; sys_platform == 'win32'",
]

[project.scripts]
rl-pfp = "rlpfp.cli:main"

[tool.setuptools]
packages = ["rlpfp"]
